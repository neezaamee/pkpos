name: Build & Release Multi-Platform Clients (Windows & Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.1.0)'
        required: false
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Client (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: pk-pos-f/pos-client/package-lock.json

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pk-pos-f/pos-client/src-tauri

      - name: Install Frontend Dependencies
        working-directory: pk-pos-f/pos-client
        run: npm ci

      - name: Build Windows Standalone Executable
        working-directory: pk-pos-f/pos-client
        run: npx tauri build --no-bundle

      - name: Stage & Rename Windows Binary
        shell: pwsh
        run: |
          mkdir -p client_artifacts
          $version = "${{ github.event.inputs.version || github.ref_name }}" -replace '^v',''
          if (-not $version) { $version = "0.1.0" }
          Copy-Item "pk-pos-f/pos-client/src-tauri/target/release/pos-client.exe" "client_artifacts/PK-POS-v$version.exe"
          (Get-FileHash -Path "client_artifacts/PK-POS-v$version.exe" -Algorithm SHA256).Hash | Out-File "client_artifacts/PK-POS-v$version.exe.sha256"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: client_artifacts/

  build-android:
    name: Build Android Client (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: pk-pos-f/pos-client/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Linux Swap Space (Prevent OOM)
        run: |
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=none || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true
          swapon --show || true
          free -h

      - name: Configure Android SDK & NDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" || true
          # Automatically find pre-installed NDK or install latest LTS NDK
          NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909129"
            NDK_DIR="/usr/local/lib/android/sdk/ndk/26.1.10909129"
          fi
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

          LLVM_BIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$LLVM_BIN" >> $GITHUB_PATH
          echo "PATH=$LLVM_BIN:$PATH" >> $GITHUB_ENV

          # Create symlinks for standard target names if missing
          if [ ! -f "$LLVM_BIN/aarch64-linux-android-clang" ]; then
            ln -sf "$LLVM_BIN/aarch64-linux-android24-clang" "$LLVM_BIN/aarch64-linux-android-clang" || true
            ln -sf "$LLVM_BIN/aarch64-linux-android24-clang++" "$LLVM_BIN/aarch64-linux-android-clang++" || true
          fi

          # Export linker and archiver for Cargo and cc-rs
          echo "TARGET_CC=$LLVM_BIN/aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "TARGET_AR=$LLVM_BIN/llvm-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$LLVM_BIN/aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=$LLVM_BIN/llvm-ar" >> $GITHUB_ENV
          echo "CC_aarch64_linux_android=$LLVM_BIN/aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "CXX_aarch64_linux_android=$LLVM_BIN/aarch64-linux-android24-clang++" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$LLVM_BIN/llvm-ar" >> $GITHUB_ENV

          # Configure global and local Cargo target linkers
          mkdir -p ~/.cargo
          printf '[build]\njobs = 1\nincremental = false\n\n[target.aarch64-linux-android]\nar = "%s/llvm-ar"\nlinker = "%s/aarch64-linux-android24-clang"\n' "$LLVM_BIN" "$LLVM_BIN" > ~/.cargo/config.toml
          mkdir -p pk-pos-f/pos-client/src-tauri/.cargo
          cp ~/.cargo/config.toml pk-pos-f/pos-client/src-tauri/.cargo/config.toml

          echo "Using Android NDK at: $NDK_DIR"
          echo "Using LLVM bin at: $LLVM_BIN"

          # Ensure Android debug keystore exists for signing
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi

      - name: Setup Rust Stable with Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            i686-linux-android
            x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pk-pos-f/pos-client/src-tauri
          key: android-v3

      - name: Install Frontend Dependencies
        working-directory: pk-pos-f/pos-client
        run: npm ci

      - name: Pre-compile Rust Library for Android Target
        working-directory: pk-pos-f/pos-client/src-tauri
        run: |
          cargo build --lib --target aarch64-linux-android --release

      - name: Initialize Android Target (if needed)
        working-directory: pk-pos-f/pos-client
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci
          fi

      - name: Commit Generated Android Target (if new)
        run: |
          if [ -d "pk-pos-f/pos-client/src-tauri/gen/android" ] && [ -n "$(git status --porcelain pk-pos-f/pos-client/src-tauri/gen/android)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pk-pos-f/pos-client/src-tauri/gen/android
            git commit -m "chore(pos-client): commit initialized Android target structure" || true
            git push origin HEAD:main || true
          fi

      - name: Build Android APK
        working-directory: pk-pos-f/pos-client
        run: |
          set -e
          set -o pipefail
          npm run build
          echo "=== Building Android APK via Tauri CLI ==="
          npx tauri android build --apk --target aarch64 --ci 2>&1 | tee android_build.log
          echo "=== Verifying build outputs ==="
          find src-tauri/gen/android/app/build -name "*.apk" -ls || true

      - name: Report Build Diagnostics on Failure
        if: failure()
        shell: bash
        run: |
          echo "=== Memory and Kernel status on failure ==="
          free -h || true
          dmesg -T | grep -i -E "oom|killed process|out of memory" | tail -n 10 || true
          if [ -f pk-pos-f/pos-client/android_build.log ]; then
            echo "=== Tail of android_build.log on failure ==="
            tail -n 120 pk-pos-f/pos-client/android_build.log || true
            tail -n 35 pk-pos-f/pos-client/android_build.log | while IFS= read -r line; do
              echo "::error title=LogDiagnostic::$line"
            done
          fi

      - name: Upload Android Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: pk-pos-f/pos-client/*.log

      - name: Stage & Rename Android APKs
        shell: bash
        run: |
          mkdir -p client_artifacts
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          [ -z "$VERSION" ] && VERSION="0.1.0"

          echo "=== Last 50 lines of android_build.log ==="
          tail -n 50 pk-pos-f/pos-client/android_build.log || true

          echo "=== Searching all APK and AAB files across workspace ==="
          find . -type f \( -iname "*.apk" -o -iname "*.aab" \) -ls || true

          found=0
          while IFS= read -r pkg; do
            if [ -n "$pkg" ] && [ -f "$pkg" ]; then
              found=1
              fname=$(basename "$pkg")
              ext="${pkg##*.}"
              echo "Packaging: $pkg -> PK-POS-v$VERSION-$fname"
              cp "$pkg" "client_artifacts/PK-POS-v$VERSION-$fname"
              sha256sum "$pkg" > "client_artifacts/PK-POS-v$VERSION-$fname.sha256"
              cp "$pkg" "client_artifacts/PK-POS-v$VERSION.$ext"
            fi
          done < <(find . -type f \( -iname "*.apk" -o -iname "*.aab" \) 2>/dev/null)

          if [ $found -eq 0 ]; then
            echo "::error::No APK or AAB files found under workspace root!"
            if [ -f pk-pos-f/pos-client/android_build.log ]; then
              echo "=== Errors from android_build.log ==="
              grep -E -i "error\[E|cannot find|undefined reference|fatal error|BUILD FAILED" pk-pos-f/pos-client/android_build.log | tail -n 20 | while IFS= read -r l; do
                echo "::error title=MissingApkLog::$l"
              done
            fi
            exit 1
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-client
          path: client_artifacts/

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-client
          path: release_assets/

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-client
          path: release_assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: PK-POS Client ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
