name: Build & Release Multi-Platform Clients (Windows & Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.1.0)'
        required: false
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Client (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: pk-pos-f/pos-client/package-lock.json

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        working-directory: pk-pos-f/pos-client
        run: npm ci

      - name: Build Windows Standalone Executable
        working-directory: pk-pos-f/pos-client
        run: npx tauri build --no-bundle

      - name: Stage & Rename Windows Binary
        shell: pwsh
        run: |
          mkdir -p client_artifacts
          $version = "${{ github.event.inputs.version || github.ref_name }}" -replace '^v',''
          if (-not $version) { $version = "0.1.0" }
          Copy-Item "pk-pos-f/pos-client/src-tauri/target/release/pos-client.exe" "client_artifacts/PK-POS-v$version.exe"
          (Get-FileHash -Path "client_artifacts/PK-POS-v$version.exe" -Algorithm SHA256).Hash | Out-File "client_artifacts/PK-POS-v$version.exe.sha256"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: client_artifacts/

  build-android:
    name: Build Android Client (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: pk-pos-f/pos-client/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & NDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          # Automatically find pre-installed NDK or install latest LTS NDK
          NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909129"
            NDK_DIR="/usr/local/lib/android/sdk/ndk/26.1.10909129"
          fi
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "Using Android NDK at: $NDK_DIR"

      - name: Setup Rust Stable with Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android

      - name: Install Frontend Dependencies
        working-directory: pk-pos-f/pos-client
        run: npm ci

      - name: Initialize Android Target (if needed)
        working-directory: pk-pos-f/pos-client
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci
          fi

      - name: Commit Generated Android Target (if new)
        run: |
          if [ -d "pk-pos-f/pos-client/src-tauri/gen/android" ] && [ -n "$(git status --porcelain pk-pos-f/pos-client/src-tauri/gen/android)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pk-pos-f/pos-client/src-tauri/gen/android
            git commit -m "chore(pos-client): commit initialized Android target structure" || true
            git push origin HEAD:main || true
          fi

      - name: Build Android APK
        working-directory: pk-pos-f/pos-client
        run: npx tauri android build --apk

      - name: Stage & Rename Android APKs
        shell: bash
        run: |
          mkdir -p client_artifacts
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          [ -z "$VERSION" ] && VERSION="0.1.0"

          found=0
          while IFS= read -r apk; do
            if [ -f "$apk" ]; then
              found=1
              fname=$(basename "$apk")
              cp "$apk" "client_artifacts/PK-POS-v$VERSION-$fname"
              sha256sum "$apk" > "client_artifacts/PK-POS-v$VERSION-$fname.sha256"
              # Also create a generic PK-POS-vX.X.X.apk link
              cp "$apk" "client_artifacts/PK-POS-v$VERSION.apk"
            fi
          done < <(find pk-pos-f/pos-client/src-tauri/gen/android -name "*.apk" 2>/dev/null)

          if [ $found -eq 0 ]; then
            echo "::warning::No APK files found under gen/android"
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-client
          path: client_artifacts/

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-client
          path: release_assets/

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-client
          path: release_assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: PK-POS Client ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
